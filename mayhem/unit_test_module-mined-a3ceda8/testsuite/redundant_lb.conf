#
#  Self-contained configuration for unit_test_module: one virtual server whose
#  "recv Access-Request" section holds the unlang under test.
#
raddb		= /mayhem/raddb
modconfdir	= ${raddb}/mods-config

modules {
	$INCLUDE ${raddb}/mods-enabled/always
}

server default {
	namespace = radius

	recv Access-Request {
		redundant-load-balance {
			fail
			ok
			updated
		}
		ok
	}
}
